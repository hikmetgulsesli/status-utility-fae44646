<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">
  <div data-surface-id="SURF_STATUS_PAGE" class="flex-1 flex flex-col justify-between p-6 md:p-10 max-w-5xl mx-auto w-full" data-setfarm-element-ref="E000001">
    <!-- Header chrome (purely decorative, no links or buttons) -->
    <header class="flex items-center justify-between pb-6 border-b border-slate-200">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-base shadow-sm">
          SU
        </div>
        <div>
          <h1 class="text-xl font-semibold text-slate-900 tracking-tight">Status Utility</h1>
          <p class="text-xs text-slate-500 font-mono">/status</p>
        </div>
      </div>
      <div class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
        <span class="w-2 h-2 mr-2 rounded-full bg-emerald-500"></span>
        Operational
      </div>
    </header>

    <!-- Main Card Body -->
    <main class="my-auto py-12 flex flex-col items-center">
      <div class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
        <!-- Visual Badge -->
        <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-slate-100 flex items-center justify-center text-slate-700">
          <svg class="w-6 h-6 text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>

        <h2 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">Service Status Overview</h2>
        <p class="text-sm text-slate-500 mb-8">Real-time status indicators and system health synchronization.</p>

        <!-- Status Readout Details -->
        <div class="bg-slate-50 rounded-xl border border-slate-100 divide-y divide-slate-100 text-left mb-8 overflow-hidden">
          <div class="p-4 flex items-center justify-between">
            <span class="text-xs font-medium uppercase tracking-wider text-slate-400">Route</span>
            <span class="text-sm font-mono text-slate-700">/status</span>
          </div>
          <div class="p-4 flex items-center justify-between">
            <span class="text-xs font-medium uppercase tracking-wider text-slate-400">Status message</span>
            <span class="text-sm font-semibold text-slate-800">Status refreshed</span>
          </div>
          <div class="p-4 flex items-center justify-between">
            <span class="text-xs font-medium uppercase tracking-wider text-slate-400">State value</span>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-mono font-medium bg-emerald-100 text-emerald-800">refreshed</span>
          </div>
        </div>

        <!-- Single declared physical control slot -->
        <button type="button" data-action="ACT_REFRESH_STATUS" data-control-slot="CSLOT_REFRESH_STATUS_REFRESH_BUTTON" class="w-full sm:w-auto px-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium rounded-lg shadow transition focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2" data-setfarm-element-ref="E000002">
          Refresh status
        </button>
      </div>
    </main>

    <!-- Footer chrome (non-actionable text) -->
    <footer class="pt-6 border-t border-slate-200 text-xs text-slate-400 flex items-center justify-between">
      <span>Status Utility © 2025</span>
      <span class="font-mono">Route: /status</span>
    </footer>
  </div>

</body></html>
